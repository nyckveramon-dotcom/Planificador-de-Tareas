<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de tareas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montagu+Slab:opsz,wght@16..144,100..700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">

    <link href="css/styles.css" rel="stylesheet">
</head>

<body>

    <div class="container-fluid vh-100">
        <div class="row h-100">

            <!--- Columna izquierda (Sidebar responsivo: se oculta en celulares 'd-none d-md-flex') -->
            <div class="col-md-3 col-lg-2 sidebar-bg text-white p-4 px-0 d-md-flex flex-column justify-content-between">
                <div class="px-3">
                    <div class="header-sidebar mb-4">
                        <h3>Planificador de tareas</h3>
                        <p class="small text-white-50">Pequeños pasos, grandes logros</p>
                    </div>

                    <ul class="nav flex-column px-2">
                        <li class="nav-item mb-2"><a href="#Inicio" class="nav-link text-white ps-0">Inicio</a></li>
                        <li class="nav-item mb-2"><a href="#Calendario"
                                class="nav-link text-white-50 ps-0">Calendario</a></li>
                        <li class="nav-item mb-2"><a href="#Tareashoy" class="nav-link text-white-50 ps-0">Tareas de
                                hoy</a></li>
                    </ul>
                </div>
                <div class="mt-auto pt-4"></div>
            </div>

            <!--- Columna derecha / Principal centrado en la mitad -->
            <div class="col-12 col-md-9 col-lg-10 main-bg p-4 overflow-auto">

                <!-- Contenedor centrado para que no ocupe todo el borde extremo -->
                <div class="col-lg-10 mx-auto">
                    <h2>¡Hola, Nycol!</h2>
                    <p class="text-muted">Hoy es un gran día para avanzar hacia tus metas.🌼</p>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="mb-0 fw-bold">Tareas de hoy</h4>
                            <button class="btn btn-sm btn-success rounded-pill px-3" data-bs-toggle="modal"
                                data-bs-target="#modalNuevaTarea">+ Nueva tarea</button>
                        </div>

                        <!--- Contenedor de tareas JS -->
                        <div id="contenedorTareas"></div>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <div class="modal fade" id="modalNuevaTarea" tabindex="-1" aria-labelledby="modalNuevaTareaLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow rounded-4 p-3">

                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold" id="modalNuevaTareaLabel">Nueva Tarea</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <!---Alerta de error-->
                <div id="alertaError" class="alert alert-danger d-none" role="alert">
                    Todos los campos con * son obligatorios
                </div>

                <div class="modal-body">
                    <form id="formularioNuevaTarea">
                        <!---Nombre de la tarea-->
                        <div class="mb-3">
                            <label for="tituloTarea" class="form-label small fw-bold">* Nombre de la tarea</label>
                            <input type="text" class="form-control rounded-pill px-3" id="tituloTarea" 
                                placeholder="Ej. Estudiar JS">
                        </div>
                        <!---Descripción-->
                        <div class="mb-3">
                            <label for="descripcionTarea" class="form-label small fw-bold">* Descripción</label>
                            <input type="text" class="form-control rounded-pill px-3" id="descripcionTarea" >
                        </div>
                        <!-- Hora inicio y fin-->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="horaInicio" class="form-label small fw-bold">* Hora inicio</label>
                                <input type="time" class="form-control rounded-pill px-3" id="horaInicio" >
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="horaFin" class="form-label small fw-bold">* Hora final</label>
                                <input type="time" class="form-control rounded-pill px-3" id="horaFin" >
                            </div>
                        </div>
                        <!-- Fecha-->
                        <div class="mb-3">
                            <label for="fechaTarea" class="form-label small fw-bold">* Fecha de entrega</label>
                            <input type="date" class="form-control rounded-pill px-3" id="fechaTarea" >
                        </div>
                        <!-- Categoría -->
                        <div class="mb-3">
                            <label for="categoriaTarea" class="form-label small fw-bold">* Categoría</label>
                            <select class="form-select rounded-pill px-3" id="categoriaTarea" >
                                <option value="" selected disabled>Seleccionar</option> 
                                <option value="Estudio">Estudio</option>
                                <option value="Salud">Salud</option>
                                <option value="Hogar">Hogar</option>
                                <option value="Proyecto">Proyecto</option>
                                <option value="Personal">Personal</option>
                            </select>
                        </div>
                        <!-- Prioridad -->
                        <div class="mb-3">
                            <label for="prioridadTarea" class="form-label small fw-bold">* Prioridad</label>
                            <select class="form-select rounded-pill px-3" id="prioridadTarea" >
                                <option value="" selected disabled>Seleccionar</option>
                                <option value="Alta">Alta</option>
                                <option value="Media">Media</option>
                                <option value="Baja">Baja</option>
                            </select>
                        </div>

                        <!-- Botón de guardar -->
                        <div class="text-end mt-4">
                            <button type="submit" class="btn btn-dark rounded-pill px-4 w-100">Guardar tarea</button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/taskManager.js"></script>
    <script src="js/index.js"></script>
</body>

</html>
